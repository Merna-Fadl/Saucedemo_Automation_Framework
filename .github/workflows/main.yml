name: Swag Labs CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    # بنضيف الصلاحيات دي عشان يقدر يرفع التقرير
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'oracle'
          cache: maven

      - name: Download Dependencies
        run: mvn dependency:go-offline

      - name: Run All Tests
        run: mvn test -DsuiteXmlFile=testng.xml
        continue-on-error: true # بنخليها true عشان لو تست فشل، يكمل ويعمل التقرير برضه

      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Allure Report Action
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results # تأكدي إن ده اسم الفولدر اللي بيطلع عندك
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy Report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages