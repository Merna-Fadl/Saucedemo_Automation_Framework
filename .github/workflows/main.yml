name: Swag Labs Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'oracle'
          cache: maven

      - name: Download Dependencies
        run: mvn dependency:go-offline # السطر ده بيضمن إن كل الملفات تنزل كاملة الأول

      - name: Run All Tests
        run: mvn test -DsuiteXmlFile=testng.xml # تأكدي من اسم ملف الـ xml بتاعك